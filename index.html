<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Controle Financeiro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f4f8;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 400px;
      margin-top: 5rem;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-toggle {
      font-size: 0.85rem;
      margin-top: 0.5rem;
      text-decoration: underline;
      background: none;
      border: none;
      color: #007bff;
      cursor: pointer;
    }
    #msg {
      font-size: 0.9rem;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <h4 class="text-center mb-3" id="form-title">Entrar</h4>

      <div id="msg" class="text-center mb-2"></div>

      <form id="form-login">
        <div class="mb-3" id="nome-field" style="display: none;">
          <label for="nome" class="form-label">Nome</label>
          <input type="text" class="form-control" id="nome">
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" required>
        </div>
        <div class="mb-3" id="idade-field" style="display: none;">
          <label for="idade" class="form-label">Idade</label>
          <input type="number" class="form-control" id="idade">
        </div>
        <button type="submit" class="btn btn-success w-100">Entrar</button>
      </form>

      <button class="btn-toggle" onclick="alternarModo()" id="toggle-btn">Não tem conta? Cadastre-se</button>
    </div>
  </div>

  <script>
    let modoCadastro = false;
    const form = document.getElementById('form-login');
    const nomeField = document.getElementById('nome-field');
    const idadeField = document.getElementById('idade-field');
    const toggleBtn = document.getElementById('toggle-btn');
    const formTitle = document.getElementById('form-title');
    const msg = document.getElementById('msg');

    const endpoint = "https://script.google.com/macros/s/AKfycby1C3AOZFJK4sJmki5HFHOk7O5ir8cbnhVO5m7gocR6CBvj5SFm8R-MnPFX7jyW-cpeNg/exec";

    function alternarModo() {
      modoCadastro = !modoCadastro;
      nomeField.style.display = modoCadastro ? 'block' : 'none';
      idadeField.style.display = modoCadastro ? 'block' : 'none';
      formTitle.textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
      form.querySelector('button').textContent = modoCadastro ? 'Cadastrar' : 'Entrar';
      toggleBtn.textContent = modoCadastro ? 'Já tem conta? Entrar' : 'Não tem conta? Cadastre-se';
      msg.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        acao: modoCadastro ? 'cadastrar' : 'login',
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
        idade: document.getElementById('idade').value
      };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: {
            'Content-Type': 'application/json'
          }
        });

        const data = await res.json();

        if (data.status === 'ok') {
          msg.style.color = 'green';
          msg.textContent = modoCadastro ? 'Cadastro realizado!' : 'Login realizado!';
          // Redirecionar para a página principal com id_usuario, por exemplo via localStorage
          localStorage.setItem('usuario', JSON.stringify(data));
          window.location.href = 'app.html';
        } else {
          msg.style.color = '#c62828';
          msg.textContent = data.mensagem;
        }
      } catch (error) {
        msg.style.color = '#c62828';
        msg.textContent = 'Erro de conexão com o servidor.';
      }
    });
  </script>
</body>
</html>
